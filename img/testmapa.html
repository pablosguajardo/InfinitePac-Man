<html lang="es">
<head>

    <title>Visualizador Inteligente de Mapas 2D</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #252526;
            color: #252526;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        textarea {
            width: 100%;
            height: 140px;
            background-color: #2d2d2d;
            color: #8ce8ff;
            border: 2px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }
        textarea:focus {
            border-color: #007acc;
            outline: none;
        }
        button {
            background-color: #007acc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #005999;
        }
        .error {
            color: #ff6b6b;
            font-weight: bold;
            margin: 0;
        }
        #map-wrapper {
            display: flex;
            justify-content: center;
            overflow-x: auto;
            padding: 15px;
            background-color: #252526;
            border-radius: 6px;
            border: 1px solid #333;
        }
        #mapa {
            display: grid;
            gap: 1px; /* Espacio mínimo para que parezca una sola estructura */
        }
        .celda {
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            user-select: none;
        }
        
        /* --- COLORES DE LOS ELEMENTOS --- */
        .pared-borde {
            background-color: #e74c3c; /* Pared exterior: Rojo brillante */
            color: white;
        }
        .pared-interior {
            background-color: #2c3e50; /* Interior de la pared: Gris oscuro/azul sólido */
            color: #555; /* Texto sutil */
        }
        .camino {
            background-color: #252526; 
            color: #111;
        }
        .especial-dos {
            background-color: #faa48f; /* El número 2: Amarillo */
            color: #111;
        }
        
        /* Leyenda explicativa */
        .leyenda {
            display: flex;
            gap: 15px;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .leyenda-item { display: flex; align-items: center; gap: 5px; }
        .cuadrito { width: 15px; height: 15px; border-radius: 2px; }
		
		/* Contenedor flotante a la izquierda */
.herramientas-flotantes {
    position: fixed;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 15px;
    background: #2d2d2d;
    padding: 15px;
    border-radius: 8px;
    border: 2px solid #444;
    z-index: 1000;
}
.btn-herramienta {
    width: 50px;
    height: 50px;
    border: 3px solid #666;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
}
/* Resaltar cuál botón está activo */
.btn-herramienta.activo {
    border-color: #007acc;
    box-shadow: 0 0 10px #007acc;
    transform: scale(1.1);
}
.especial-tres {
    background-color: #f1c40f; /* Amarillo */
    color: #111;
}

    </style>

<body>

    <button onclick="procesarYDibujar()">Renderizar Mapa 🚀</button>
    <p id="errorMessage" class="error"></p>

    <h3>Mapa Generado:</h3>

<script>
    function procesarYDibujarAnt() {
        const inputText = document.getElementById('arrayInput').value;
        const contenedorMapa = document.getElementById('mapa');
        const errorMessage = document.getElementById('errorMessage');
        
        errorMessage.innerText = '';
        contenedorMapa.innerHTML = '';

        try {
            const matriz = Function("\"use strict\"; return (" + inputText + ")")();

            if (!Array.isArray(matriz) || !Array.isArray(matriz[0])) {
                throw new Error("Formato inválido.");
            }

            const filas = matriz.length;
            const columnas = matriz[0].length;

            contenedorMapa.style.gridTemplateColumns = `repeat(${columnas}, 25px)`;

            // Recorremos la matriz para renderizarla
            for (let r = 0; r < filas; r++) {
                for (let c = 0; c < columnas; c++) {
                    const valor = Number(matriz[r][c]);
                    const celda = document.createElement('div');
                    celda.classList.add('celda');
                    celda.innerText = '';//valor;

                   /* if (valor === 1) {
                        // REGLA INTELIGENTE: Verificar si está completamente rodeado de '1's
                        // Miramos arriba, abajo, izquierda y derecha cuidando no salirnos de los límites
                        const arriba    = r > 0 ? Number(matriz[r-1][c]) : 0;
                        const abajo     = r < filas - 1 ? Number(matriz[r+1][c]) : 0;
                        const izquierda = c > 0 ? Number(matriz[r][c-1]) : 0;
                        const derecha   = c < columnas - 1 ? Number(matriz[r][c+1]) : 0;

                        // Si sus 4 vecinos directos también son paredes (1), es una celda interior
                        if (arriba === 1 && abajo === 1 && izquierda === 1 && derecha === 1) {
                            //celda.classList.add('pared-interior');
							celda.classList.add('pared-borde');
                        } else {
                            celda.classList.add('pared-borde'); // Es parte del contorno exterior
                        }
                    } else if (valor === 2) {
                        celda.classList.add('especial-dos');
                    } else {
                        celda.classList.add('camino');
                    }*/
					if (valor === 1) {
						celda.classList.add('pared-borde');
					} else if (valor === 2) {
						celda.classList.add('especial-dos');
					} else if (valor === 3) {
						celda.classList.add('especial-tres');
					} else {
						celda.classList.add('camino');
					}
                    contenedorMapa.appendChild(celda);
                }
            }

        } catch (error) {
            errorMessage.innerText = "❌ Hubo un problema al procesar el array. Revisa las comas y los corchetes.";
            console.error(error);
        }
    }

    // Variables globales para el estado del editor
    let matrizActual = []; 
    let herramientaActiva = null; // Puede ser 1 (pared) o 0 (camino)
    let mouseApretado = false;

    // Detectar si el usuario tiene el clic del mouse presionado en la pantalla
    window.addEventListener('mousedown', () => mouseApretado = true);
    window.addEventListener('mouseup', () => mouseApretado = false);

    // Activar/Desactivar los botones flotantes
   function seleccionarHerramienta(valor) {
		if (herramientaActiva === valor) {
			herramientaActiva = null;
			document.getElementById('btnPared').classList.remove('activo');
			document.getElementById('btnCamino').classList.remove('activo');
			document.getElementById('btnTres').classList.remove('activo');
			document.getElementById('btnClonar').classList.remove('activo');
		} else {
			herramientaActiva = valor;
			document.getElementById('btnPared').classList.toggle('activo', valor === 1);
			document.getElementById('btnCamino').classList.toggle('activo', valor === 0);
			document.getElementById('btnTres').classList.toggle('activo', valor === 3);
			document.getElementById('btnClonar').classList.toggle('activo', valor === 'clonar');
		}
	}



    // Actualiza el Textarea con el estado actual de la matriz en memoria
    function actualizarTextarea() {
        // Formatea el array de forma limpia para que se vea ordenado en filas
        const lineas = matrizActual.map(fila => "  [" + fila.join(",") + "]");
        document.getElementById('arrayInput').value = "[\n" + lineas.join(",\n") + "\n]";
    }

    // Acción de pintar una celda específica
    function pintarCelda(r, c, elementoHTML) {
		if (herramientaActiva === null) return;

		matrizActual[r][c] = herramientaActiva;
		
		elementoHTML.className = 'celda'; 
		elementoHTML.innerText = herramientaActiva;
		
		if (herramientaActiva === 1) {
			elementoHTML.classList.add('pared-borde');
		} else if (herramientaActiva === 3) {
			elementoHTML.classList.add('especial-tres');
		} else {
			elementoHTML.classList.add('camino');
		}

		actualizarTextarea();
	}


    function procesarYDibujar() {
        const inputText = document.getElementById('arrayInput').value;
        const contenedorMapa = document.getElementById('mapa');
        const errorMessage = document.getElementById('errorMessage');
        
        errorMessage.innerText = '';
        contenedorMapa.innerHTML = '';

        try {
            matrizActual = Function("\"use strict\"; return (" + inputText + ")")();

            if (!Array.isArray(matrizActual) || !Array.isArray(matrizActual[0])) {
                throw new Error("Formato inválido.");
            }

            const filas = matrizActual.length;
            const columnas = matrizActual[0].length;

            contenedorMapa.style.gridTemplateColumns = `repeat(${columnas}, 25px)`;

            for (let r = 0; r < filas; r++) {
                for (let c = 0; c < columnas; c++) {
                    const valor = Number(matrizActual[r][c]);
                    const celda = document.createElement('div');
                    celda.classList.add('celda');
                    celda.innerText = valor;

                    // Colores iniciales
                    if (valor === 1) {
                        celda.classList.add('pared-borde');
                    } else if (valor === 2) {
                        celda.classList.add('especial-dos');
                    } else {
                        celda.classList.add('camino');
                    }

                    // EVENTO 1: Si hace un solo clic sobre la celda
                   /* celda.addEventListener('mousedown', (e) => {
                        e.preventDefault(); // Evita selecciones de texto raras al arrastrar
                        pintarCelda(r, c, celda);
                    });*/
					// Evento al hacer clic
					celda.addEventListener('mousedown', (e) => {
						e.preventDefault(); 
						
						if (herramientaActiva === 'clonar') {
							// Detener cualquier otro evento para evitar que intente pintar la celda
							e.stopImmediatePropagation();
							
							// Clonamos la fila haciendo una copia limpia de los valores
							const filaCopiada = [...matrizActual[r]];
							
							// La insertamos justo arriba
							matrizActual.splice(r, 0, filaCopiada);
							
							// Sincronizamos el cuadro de texto y redibujamos el mapa limpio
							actualizarTextarea();
							procesarYDibujar(); 
						} else {
							// Si es un pincel normal (0 o 1), pintamos la celda
							pintarCelda(r, c, celda);
						}
					});

					// Evento al arrastrar el mouse
					celda.addEventListener('mouseenter', (e) => {
						// Solo permitimos pintar si el mouse está apretado Y NO estamos clonando
						if (mouseApretado && herramientaActiva !== 'clonar') {
							pintarCelda(r, c, celda);
						}
					});

                    contenedorMapa.appendChild(celda);
                }
            }

        } catch (error) {
            errorMessage.innerText = "❌ Hubo un problema al procesar el array.";
            console.error(error);
        }
    }

    // Carga inicial del mapa
    procesarYDibujar();
</script>
